name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  update-publications:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-publications.txt

      - name: Update publications
        run: python scripts/update_publications.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update publications from Google Scholar"
          file_pattern: "_bibliography/papers.bib"
